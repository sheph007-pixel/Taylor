<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Runner — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="rr-admin-shell">
    <!-- Top bar -->
    <div class="rr-admin-topbar">
      <div class="rr-admin-topbar-row">
        <div class="rr-admin-brand">
          <span class="rr-admin-mark"><span class="rr-admin-mark-diamond"></span></span>
          <div class="rr-admin-brand-text">
            <span class="rr-admin-wordmark">ROUTE<span class="rr-admin-wordmark-sep">·</span>RUNNER</span>
            <span class="rr-admin-sublabel">Admin Console</span>
          </div>
        </div>
        <div class="rr-admin-sync">
          <span class="rr-admin-sync-dot"></span>
          <span class="rr-admin-sync-label">Synced</span>
        </div>
      </div>

      <div class="rr-admin-tabs">
        <button type="button" class="rr-admin-tab is-active" data-tab="upload">Upload</button>
        <button type="button" class="rr-admin-tab" data-tab="routes">Routes</button>
      </div>
    </div>

    <!-- Screen body -->
    <div class="rr-admin-body">
      <!-- UPLOAD SCREEN (legacy content — step 8 rebuilds it) -->
      <div id="admin-screen-upload" class="admin-screen active">
        <div class="admin-legacy-container">
          <h1>Route Runner Admin</h1>
          <p class="subtitle">Upload delivery routes for your drivers <span style="color:var(--text-low);font-size:11px">v10</span></p>

          <div class="upload-box" id="upload-box">
            <input type="file" id="file-input" accept=".csv,.xlsx,.xls" hidden>
            <div class="upload-icon">&#128194;</div>
            <p class="upload-text">Tap to upload delivery list</p>
            <p class="upload-hint">CSV or Excel with company names &amp; addresses</p>
          </div>

          <div id="status" class="status hidden"></div>

          <div class="route-name-section" id="name-section" style="display:none">
            <label for="route-name">Route Name</label>
            <input type="text" id="route-name" class="route-name-input" placeholder="e.g. Vestavia, Monday Downtown" maxlength="50">
          </div>

          <div id="estimate-card" class="estimate-card" style="display:none"></div>
          <div id="stops-preview" class="stops-preview" style="display:none"></div>
          <button id="btn-save" class="btn" style="display:none" onclick="saveRoute()">Save Route</button>
        </div>
      </div>

      <!-- SAVED ROUTES SCREEN (legacy list — step 9 rebuilds it) -->
      <div id="admin-screen-routes" class="admin-screen">
        <div class="admin-legacy-container">
          <div id="saved-routes" class="saved-routes" style="display:block"></div>
        </div>
      </div>

      <!-- EDIT ROUTE SCREEN (built in step 10) -->
      <div id="admin-screen-edit" class="admin-screen"></div>
    </div>
  </div>

  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p id="loading-msg">Loading...</p>
    <div class="progress-bar-container" id="progress-bar">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
